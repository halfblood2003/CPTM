name: cloud-enum
display_name: cloud_enum
description: Enumerate public cloud services (AWS/Azure/GCP) for a given domain — buckets, Azure sites, GCP apps.
category: general
docker_image: cptm-toolbox:latest
command_template: cloud_enum -k {keyword} {extra_args}
output_type: cloud-enum
params:
  - name: keyword
    label: Keyword / domain
    type: string
    default: ""
    required: true
  - name: extra_args
    label: Extra CLI arguments
    type: string
    default: ""
    required: false
